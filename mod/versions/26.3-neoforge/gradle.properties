# Minecraft version
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
# Every Minecraft version this one jar is released for (its compiled classes are identical
# on all of them); read by tools/release/make-update-manifest.py.
minecraft_versions=26.3

# NeoForge — check these on https://projects.neoforged.net/neoforged/neoforge and .../neoform
neoforge_version=26.3.0.101
neo_form_version=26.3-1
neoforge_loader_version_range=[4,)

# Unobfuscated Minecraft (26.x) requires Java 25 — overrides the shared java_version=21.
java_version=25
