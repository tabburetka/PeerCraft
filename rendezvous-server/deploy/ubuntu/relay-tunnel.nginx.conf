# Install inside nginx's http context (e.g. /etc/nginx/conf.d/peercraft-relay.conf).
# This listener is only for cloudflared on the SAME trusted machine.
server {
    listen 127.0.0.1:51082;
    server_name _;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    access_log off;
    client_max_body_size 8k;
    client_body_timeout 10s;
    location /v1/relay/ {
        proxy_set_header X-PeerCraft-Client-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:51081;
    }
    location / { return 404; }
}
