# preferIPv4Stack: on hosts without a working IPv6 route Java may pick the AAAA record of the
# Mojang/Forge download hosts and the download dies (same as the other backports).
org.gradle.jvmargs = -Xmx4G -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
loom.platform = forge

# Shared with mod/gradle.properties — keep in sync.
mod_id = peercraft
mod_name = PeerCraft
mod_version = 3.5.0
maven_group = net.peercraft

minecraft_version = 1.8.9
forge_version = 1.8.9-11.15.1.2318-1.8.9
# MCP names for 1.8.9 (dev time; the jar is remapped to SRG/notch for production).
mcp_mappings = 22-1.8.9
# Mixin 0.7.11 is the last one that runs on 1.8.9's LaunchWrapper; it is shaded into the jar and
# started through its tweaker, as 1.8.9 has no MixinBooter/UniMixins equivalent.
mixin_version = 0.7.11-SNAPSHOT
