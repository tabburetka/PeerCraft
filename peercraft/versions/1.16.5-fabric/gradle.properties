# Minecraft version
minecraft_version=1.16.5
minecraft_version_range=[1.16.5,1.17)

# Fabric — 1.16.5 is the last version on official Fabric. Loader 0.19.4 is the newest
# release meta.fabricmc.net still lists for 1.16.5; fabric-api 0.42.0+1.16 is the final
# 1.16.x API build. Mappings are officialMojangMappings() like every other Fabric node.
loader_version=0.19.4
fabric_api_version=0.42.0+1.16

# 1.16.5 shipped on Java 8 and mods target Java 8 bytecode — overrides the shared java_version=21.
java_version=8
