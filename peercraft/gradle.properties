# 2G was enough for a single Minecraft version; running the full 1.21.1-1.21.11 x Fabric/NeoForge
# matrix in parallel (buildAll/chiseled tasks) needs more headroom or the daemon OOMs mid-build.
org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod Properties (shared across every Minecraft version and loader — per-version/per-loader
# dependency numbers live in versions/<mc-version>/gradle.properties instead)
mod_version=2.1.0
maven_group=net.peercraft
mod_id=peercraft
mod_name=PeerCraft
mod_author=_i_kukumber_
license=CC-BY-NC-4.0
java_version=21

# Loader tooling versions (the Gradle plugins themselves, not Minecraft-version-coupled —
# a single Loom/ModDev release builds against many Minecraft versions).
# check these on https://fabricmc.net/develop and https://projects.neoforged.net/neoforged/moddevgradle
loom_version=1.17-SNAPSHOT
moddev_version=2.0.144
