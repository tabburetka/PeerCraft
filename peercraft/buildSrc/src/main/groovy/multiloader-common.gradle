plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    // Mixin annotations are needed at compile time in common (mixin classes live there too),
    // even though each loader applies mixins through its own bundled Mixin runtime.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
}

// Every loader module compiles common's sources directly into its own jar (see
// multiloader-loader.gradle), so the outgoing variants here only need to be resolvable by
// name for the compileOnly(":common"){ requireCapability ... } type-checking dependency.
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

processResources {
    def expandProps = [
            'version'                       : version,
            'minecraft_version_range'       : minecraft_version_range,
            'neoforge_version'              : neoforge_version,
            'neoforge_loader_version_range' : neoforge_loader_version_range,
    ]
    inputs.properties(expandProps)
    filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand(expandProps)
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
            artifactId = base.archivesName.get()
        }
    }
    repositories {
        // Add repositories to publish to here.
    }
}
