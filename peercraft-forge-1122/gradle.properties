# preferIPv4Stack: this host has no working IPv6 route; RFG's downloader otherwise picks the
# AAAA record for piston-data.mojang.com and fails with ENETUNREACH ("Сеть недоступна").
org.gradle.jvmargs = -Xmx4G -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
# Gradle 8.8 must run on Java <= 22; the system default may be newer.
org.gradle.java.home = /usr/lib/jvm/java-21-openjdk
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.caching = true
# RetroFuturaGradle 2.x does not support the Gradle configuration cache yet.
org.gradle.configuration-cache = false

# Shared with peercraft/gradle.properties — keep in sync.
mod_id = peercraft
mod_name = PeerCraft
mod_version = 2.0.0
maven_group = net.peercraft

minecraft_version = 1.12.2
# MCP mapping names for 1.12.2 (readable dev-time names; SRG at runtime via reobfJar).
mapping_channel = stable
mapping_version = 39

use_mixin = true
# 8.x still bundles the SpongePowered Mixin AP that RFG's modUtils.enableMixins wires up;
# 11.x switched to com.cleanroommc:cleanmix and splits the annotation processor out.
mixin_booter_version = 8.9
