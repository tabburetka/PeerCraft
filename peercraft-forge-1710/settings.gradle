pluginManagement {
	repositories {
		gradlePluginPortal()
		maven {
			name = "GTNH Maven"
			url = uri("https://nexus.gtnewhorizons.com/repository/public/")
		}
		mavenCentral()
	}
}

plugins {
	// Lets Gradle auto-download a JDK 8 toolchain (no system JDK 8 on this machine).
	// 0.9.0 is the last release supporting Gradle 8.x (1.0.0 targets Gradle 9).
	id "org.gradle.toolchains.foojay-resolver-convention" version "0.9.0"
}

rootProject.name = "peercraft-forge-1710"
