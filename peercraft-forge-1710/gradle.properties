# preferIPv4Stack: this host has no working IPv6 route; RFG's downloader otherwise picks the
# AAAA record for piston-data.mojang.com and fails with ENETUNREACH ("Сеть недоступна").
org.gradle.jvmargs = -Xmx4G -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false
# Gradle 8.8 must run on Java <= 22; the system default may be newer.
org.gradle.java.home = /usr/lib/jvm/java-21-openjdk
org.gradle.daemon = true
org.gradle.parallel = true
org.gradle.caching = true
# RetroFuturaGradle 2.x does not support the Gradle configuration cache yet.
org.gradle.configuration-cache = false

# Shared with peercraft/gradle.properties — keep in sync.
mod_id = peercraft
mod_name = PeerCraft
mod_version = 2.1.0
maven_group = net.peercraft

minecraft_version = 1.7.10
# MCP mapping names for 1.7.10 (readable dev-time names; SRG at runtime via reobfJar).
mapping_channel = stable
mapping_version = 12

use_mixin = true
# 1.7.10 has no official Mixin and no MixinBooter (that's a 1.12.2 mod). UniMixins is the
# standard 1.7.10 Mixin loader: it bundles a Mixin fork + the GTNHMixins "early mixin loader"
# interface PeerCraftCoreMod implements. The ":dev" classifier is the deobf jar for compiling
# against; the plain jar (or the standalone UniMixins "-all" download) is what a player drops
# in mods/ at runtime, exactly like MixinBooter for the 1.12.2 backport.
unimixins_version = 0.3.1
